name: Compile examples

on:
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'src/**'
      - '.github/workflows/compile-examples.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'src/**'
      - '.github/workflows/compile-examples.yml'

jobs:
  compile-sketch:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - fqbn: "arduino:avr:uno"
            platforms: |
              - name: arduino:avr
            sketch-paths: |
              - ./examples/buttons
              - ./examples/groups
              - ./examples/leds
              - ./examples/multiplexers/multiplexed_buttons
              - ./examples/multiplexers/multiplexed_potentiometers
              - ./examples/multiplexers/multiplexed_rotary_encoder
              - ./examples/potentiometers
              - ./examples/real-time/external_adc
              - ./examples/rotary_encoders
          - fqbn: "arduino:avr:mega:cpu=atmega2560"
            platforms: |
              - name: arduino:avr
            sketch-paths: |
              - ./examples/multiplexers/multiplexers_daisy_chained
              - ./examples/real-time/time_sliced_processing
              - ./examples/real-time/benchmark
          - fqbn: "esp32:esp32:esp32s3"
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketch-paths: |
              - ./examples
          - fqbn: "rp2040:rp2040:rpipico"
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            sketch-paths: |
              - ./examples

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.2'

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          sketch-paths: ${{ matrix.sketch-paths }}
          libraries: |
            - source-path: ./src

  library-warnings:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        fqbn:
          - "arduino:avr:mega:cpu=atmega2560"
          - "rp2040:rp2040:rpipico"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install "$(echo '${{ matrix.fqbn }}' | cut -d: -f1,2)"

      # Compiling any sketch that includes the library compiles all of src/.
      # Only warnings from the library itself fail the build, not those from the board's core.
      - name: Compile with all warnings, fail on library warnings
        run: |
          output=$(arduino-cli compile --fqbn "${{ matrix.fqbn }}" --library . --warnings all examples/multiplexers/multiplexers_daisy_chained 2>&1) || { echo "$output"; exit 1; }
          warnings=$(echo "$output" | grep -E "/src/[^:]+:[0-9]+:[0-9]+: warning:" | grep -F "$GITHUB_WORKSPACE/src/" || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            exit 1
          fi
          echo "No library warnings."
