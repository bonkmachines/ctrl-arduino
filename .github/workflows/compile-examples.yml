name: Compile examples

on:
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'src/**'
      - '.github/workflows/compile-examples.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'examples/**'
      - 'src/**'
      - '.github/workflows/compile-examples.yml'

jobs:
  compile-sketch:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - fqbn: "arduino:avr:uno"
            platforms: |
              - name: arduino:avr
            sketch-paths: |
              - ./examples/buttons
              - ./examples/groups
              - ./examples/leds
              - ./examples/multiplexers/multiplexed_buttons
              - ./examples/multiplexers/multiplexed_potentiometers
              - ./examples/multiplexers/multiplexed_rotary_encoder
              - ./examples/potentiometers
              - ./examples/real-time/external_adc
              - ./examples/rotary_encoders
          - fqbn: "arduino:avr:mega:cpu=atmega2560"
            platforms: |
              - name: arduino:avr
            sketch-paths: |
              - ./examples/multiplexers/multiplexers_daisy_chained
              - ./examples/real-time/time_sliced_processing
          - fqbn: "esp32:esp32:esp32s3"
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketch-paths: |
              - ./examples
          - fqbn: "rp2040:rp2040:rpipico"
            platforms: |
              - name: rp2040:rp2040
                source-url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            sketch-paths: |
              - ./examples

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.2'

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          sketch-paths: ${{ matrix.sketch-paths }}
          libraries: |
            - source-path: ./src
